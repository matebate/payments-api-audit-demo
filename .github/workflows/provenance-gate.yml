# Make this a REQUIRED status check in branch protection, or it is advice, not a control.
name: provenance-gate
on: pull_request
permissions: { contents: read }
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch git-ai notes if the repo uses them
        run: git fetch origin 'refs/notes/ai:refs/notes/ai' || true
      - name: Every commit has a ticket; every agent commit links to its session
        run: bash tools/provenance_gate.sh "origin/${{ github.base_ref }}" HEAD
